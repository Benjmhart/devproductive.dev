{% extends "base.html" %}
{% block title %}{{ section.title }} · {{ config.title }}{% endblock %}
{% block content %}
<h1>{{ section.title }}</h1>
<ul class="posts">{% for p in section.pages %}<li><span class="meta">{{ p.date }}</span> <a href="{{ p.permalink }}">{{ p.title }}</a></li>{% else %}<li>Nothing yet.</li>{% endfor %}</ul>
{% endblock %}
